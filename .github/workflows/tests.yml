name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    name: ${{ matrix.os == 'macos-15-intel' && 'Tap syntax (Intel macOS)' || format('Tap checks ({0})', matrix.os) }}
    strategy:
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Detect formula changes
        id: formula-changes
        if: github.event_name == 'pull_request' && matrix.os != 'macos-15-intel'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tap_repository=$(brew --repository "$GITHUB_REPOSITORY")
          git -C "$tap_repository" fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          changed_files=$(git -C "$tap_repository" diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- 'Formula/*.rb')
          if [[ -n "$changed_files" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Upstream core no longer supplies Intel macOS dependency bottles.
      # Keep its tap-syntax check; do not label a skipped build as tested.
      - run: brew test-bot --only-formulae --fail-fast
        if: github.event_name == 'pull_request' && matrix.os != 'macos-15-intel' && steps.formula-changes.outputs.changed == 'true'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request' && matrix.os != 'macos-15-intel' && steps.formula-changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
          if-no-files-found: error
